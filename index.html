<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ally Balance Hub – Prototype</title>
<style>
:root{--hd:#650360;--p:#650360;--t:#0e8a84;--bg:#f6f1f6;--card:#fff;--tx:#231323;--mu:#6c5a6c;--bd:#e6dbe6;--soft:#efe3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#b45cad;--t:#3cc4bc;--bg:#150b15;--card:#241524;--tx:#f4eaf4;--mu:#bba6bb;--bd:#3b263b;--soft:#321d32}}
:root[data-theme="dark"]{--p:#b45cad;--t:#3cc4bc;--bg:#150b15;--card:#241524;--tx:#f4eaf4;--mu:#bba6bb;--bd:#3b263b;--soft:#321d32}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px}
header b{font-size:18px;letter-spacing:.2px}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
main{padding:16px}
h2{font-size:22px;margin:4px 0 12px;line-height:1.2}
h3{font-size:16px;margin:18px 0 8px}
.mu{color:var(--mu);margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;color:inherit;text-decoration:none}
.row .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:13px}
.row small{display:block;color:var(--mu)}
.row::after{content:"›";margin-left:auto;color:var(--mu);font-size:20px}
.home{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:150px 150px;gap:12px}
.tile{border-radius:18px;padding:16px;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:28px}
.tile b{font-size:20px}.tile small{font-size:13px;opacity:.9}
.tile.w{background:#4a0246}.tile.g{background:#0b7a75}.tile.l{background:#8b3a85;grid-column:2;grid-row:1/3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 a,.grid2 .cell{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;color:inherit;text-decoration:none;min-height:88px;display:flex;flex-direction:column;justify-content:space-between}
.grid2 .cell b,.grid2 a b{font-size:15px}.grid2 span{font-size:24px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.btn{display:block;width:100%;border:0;background:var(--p);color:#fff;font:inherit;font-weight:600;padding:13px;border-radius:12px;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--soft);color:var(--p)}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px;margin:4px 0 10px}
label{font-weight:600;font-size:13px;color:var(--mu)}
.video{height:220px;border-radius:18px;background:linear-gradient(160deg,#650360,#0b7a75);color:#fff;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:12px}
.video b{font-size:18px}
.video button{align-self:flex-end;margin-top:10px;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.quote{border-left:4px solid var(--t);padding:4px 12px;margin-bottom:12px;font-style:italic}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;border-bottom:1px solid var(--bd);padding-top:8px}
.bars i{flex:1;background:var(--t);border-radius:6px 6px 0 0;min-height:6px}
.big{font-size:34px;font-weight:700;color:var(--p);margin:0}
.dash{border:2px dashed var(--bd);border-radius:14px;min-height:200px;display:grid;place-items:center;color:var(--mu);text-align:center;padding:16px}
.timer{font-size:56px;font-weight:700;text-align:center;color:var(--p);margin:8px 0;font-variant-numeric:tabular-nums}
.breath{width:140px;height:140px;border-radius:50%;background:var(--t);opacity:.75;margin:20px auto;animation:br 8s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.35)}}
@media(prefers-reduced-motion:reduce){.breath{animation:none}}
.chat p{margin:6px 0;padding:9px 12px;border-radius:12px;max-width:85%}
.chat .me{background:var(--p);color:#fff;margin-left:auto}.chat .ai{background:var(--soft)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.row.st::after{content:none}
.tag{display:block;font-size:12px;color:var(--t);font-weight:700}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.qa a{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 6px;text-align:center;color:inherit;text-decoration:none;font-size:12.5px;font-weight:600}
.qa span{display:block;font-size:22px}
.sr{position:relative}.sr input{padding-left:38px;margin:0 0 12px}.sr::before{content:"🔍";position:absolute;left:12px;top:11px;font-size:15px}
.feat{background:var(--soft);border-radius:16px;padding:16px;margin:14px 0 12px}
.path{width:100%;text-align:left;font:inherit;color:inherit;display:flex;gap:12px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.path.sel{border-color:var(--p);background:var(--soft)}.path>span{font-size:26px}
.wide{display:flex;gap:12px;align-items:center;background:var(--hd);color:#fff;border-radius:16px;padding:16px;text-decoration:none}
.wide small{display:block;opacity:.85}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ag[hidden]{display:none}
.app{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:30px 10px 14px;text-align:center;font-size:13px;min-height:132px;display:flex;flex-direction:column;align-items:center;gap:10px}
.app .dots{position:absolute;top:4px;right:6px;background:none;border:0;color:var(--mu);font-size:14px;cursor:pointer;padding:4px 6px}
.lg{width:48px;height:48px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:var(--card);border-top:1px solid var(--bd);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
nav a{flex:1;text-align:center;color:var(--mu);text-decoration:none;font-size:12px}
nav a span{display:block;font-size:20px}nav a.on{color:var(--p);font-weight:700}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--t);outline-offset:2px}
</style></head><body>
<div id="app"><header><button id="bk" aria-label="Back">‹</button><b id="ttl"></b></header><main id="v"></main></div>
<nav id="nav"></nav>
<script>
const T={mgr:'Manager resources',news:'Employee newsletter',dir:'Resource directory',paths:'Learning paths',career:'Career growth',personal:'Personal growth',well:'Mental growth & wellbeing',home:'Balance Hub',work:'Appforce',growth:'Growth',life:'Life',obj:'Objective',note:'Notebook',lto:'LTO',reimb:'Reimbursement',coach:'Coach & AI Assistant',learn:'In-work learning',peer:'Peer Connect',focus:'Focus',med:'Meditation',food:'Food prep',hol:'Holiday',travel:'Travel',others:'Weather, traffic & news',family:'Family',hr:'HR Portal & Benefits'};
const P={mgr:'home',news:'home',dir:'home',paths:'growth',career:'growth',personal:'growth',well:'life',work:'home',growth:'home',life:'home',obj:'growth',note:'growth',lto:'growth',reimb:'growth',coach:'growth',learn:'growth',peer:'growth',focus:'life',med:'life',food:'life',hol:'life',travel:'life',others:'life',family:'life',hr:'life'};
const S={ltoMin:60,lto:[{o:'SQL window functions',m:60,d:'Module 3'},{o:'Leadership talk',m:30,d:'Recording'},{o:'Fabric basics',m:120,d:'Hands-on lab'}],rb:[{o:'Data course',a:120}],goals:['Finish the analytics certificate'],chat:[['ai','Hi! I can see your role, goals and learning history. What would you like to work on?']],vid:0,path:null,wq:'',ws:'',pins:[],tm:1500,run:null,dnd:false};
const Q=['Small steps, taken often, beat big leaps.','Protect your time and it will protect you.','Learn something small today.'];
const VID=['Tech Talk: Intro to Microsoft Fabric (20 min)','Tech Talk: SQL tips for faster queries (15 min)','Tech Talk: How AI assistants fit into your workflow (25 min)'];
const row=(h,n,t,s)=>`<a class="row" href="#${h}"><span class="n">${n}</span><div>${t}${s?`<small>${s}</small>`:''}</div></a>`;
const cell=(h,e,t,s)=>`<a href="#${h}"><span>${e}</span><div><b>${t}</b><small class="mu">${s||''}</small></div></a>`;
const box=(e,t,s)=>`<div class="cell"><span>${e}</span><div><b>${t}</b><small class="mu">${s||''}</small></div></div>`;
const it=(t,h)=>h?`<a class="row" href="#${h}"><div>${t}</div></a>`:`<div class="row st"><div>${t}</div></div>`;
const ch=(t,h)=>`<a class="chip" style="text-decoration:none" href="#${h}">${t}</a>`;
const IDX=[['Training videos','career'],['Certifications','career'],['Career pathing','career'],['Career conversation & interview guides','career'],['Career development','career'],['Individual development plan','career'],['Goal-setting','career'],['Learning paths','paths'],['Mentoring & job shadowing','peer'],['Find a mentor','peer'],['Burnout','well'],['Stress management','med'],['Mindfulness','med'],['Public speaking','personal'],['Books & podcasts','personal'],['Parenting','family'],['Caregiver support','family'],['Retirement planning','family'],['Budgeting','family'],['Leave & flexibility','family'],['Benefits','hr'],['Reimbursement','reimb'],['LTO learning time','lto'],['Focus timer','focus'],['Travel','travel'],['Food prep','food'],['Coach','coach'],['Manager training','mgr'],['Supporting working parents','mgr'],['Flexible work practices','mgr'],['Conversation guides','mgr'],['Workload planning','mgr'],['Inclusive leadership','mgr'],['Newsletter','news'],['Employee spotlight','news'],['Monthly resource spotlight','news'],['Detaching from work','news'],['Bullying','family'],['Childcare','family'],['School readiness','family'],['Resource directory','dir']];
function srch(v){const o=document.getElementById('sres'),q=v.trim().toLowerCase();o.innerHTML=q?(IDX.filter(x=>x[0].toLowerCase().includes(q)).map(x=>it(x[0],x[1])).join('')||'<p class="mu">No match. Try "burnout" or "mentor".</p>'):''}
const APPS=['Salesforce.com AllyA (103704)','Snowflake','DBT Cloud','GitLab Enterprise','Posit Connect Cloud - PROD','Posit Workbench Cloud - PROD','DataRobot Enterprise SaaS','Ally ServiceNow PROD - SAML','Defi Azure (xLOS/EPS) Prod','Coupa','Amex Legacy','HR Platform'];
const COL=['#0b7a75','#650360','#8b3a85','#4a0246'];
function appGrid(){let l=APPS.filter(a=>a.toLowerCase().includes(S.wq.toLowerCase()));if(S.ws=='az')l.sort();else if(S.ws=='za')l.sort().reverse();l.sort((a,b)=>S.pins.includes(b)-S.pins.includes(a));return l.map(a=>{const i=APPS.indexOf(a),p=S.pins.includes(a);return`<div class="app"><button class="dots" aria-label="${p?'Unpin':'Pin'} ${a}" onclick="pin(${i})">${p?'📌':'•••'}</button><div class="lg" style="background:${COL[i%4]}">${a[0]}</div><span>${a}</span></div>`}).join('')||'<p class="mu">No apps match your search.</p>'}
function pin(i){const a=APPS[i],k=S.pins.indexOf(a);k<0?S.pins.push(a):S.pins.splice(k,1);document.getElementById('ag').innerHTML=appGrid()}
const R={
home:()=>`<h2>Build a career you love without sacrificing what matters.</h2><p class="mu" style="margin-bottom:14px">Your growth. Your wellbeing. Your journey.</p><div class="sr"><input type="search" aria-label="Search" placeholder="Search training, benefits, tools, videos" oninput="srch(this.value)"></div><div id="sres"></div><div class="home"><a class="tile w" href="#work">💼<b>Work</b><small>Appforce</small></a><a class="tile g" href="#growth">🌱<b>Growth</b><small>Learn at your pace</small></a><a class="tile l" href="#life">🌿<b>Life</b><small>Rest, family, fun</small></a></div>
<h3>Quick access</h3><div class="qa"><a href="#career"><span>▶️</span>Training videos</a><a href="#career"><span>🏅</span>Certifications</a><a href="#career"><span>🧭</span>Career pathing</a><a href="#well"><span>🛡️</span>Prevent burnout</a><a href="#peer"><span>🤝</span>Find a mentor</a><a href="#hr"><span>💡</span>Benefits &amp; support</a></div>
<div class="feat"><b>Featured this month</b><h3 style="margin:6px 0">Own Your Career Journey</h3><p class="mu">Identify your strengths, build a development plan, prepare for career conversations, and take your next step.</p><a class="btn" href="#career" style="text-decoration:none;text-align:center">Watch the series</a></div>
<h3>More from the hub</h3>${row('news','📰','Employee newsletter','Stories, ideas and connection')}${row('mgr','🧑‍💼','Manager resources','Supporting working parents')}<a class="wide" href="#dir" style="background:#0b7a75;margin-top:6px"><div><small>Need help finding something?</small><b>Start with the resource directory</b><small>Browse by topic, audience or life moment</small></div></a>`,
work:()=>`<div class="sr"><input type="search" aria-label="Search your apps" placeholder="Search your apps" value="${S.wq}" oninput="S.wq=this.value;document.getElementById('ag').innerHTML=appGrid()"></div>
<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">My Apps</h2><select aria-label="Sort" style="width:auto;margin:0" onchange="S.ws=this.value;document.getElementById('ag').innerHTML=appGrid()"><option value="">Sort</option><option value="az" ${S.ws=='az'?'selected':''}>A to Z</option><option value="za" ${S.ws=='za'?'selected':''}>Z to A</option></select></div>
<h3 style="cursor:pointer" onclick="const g=document.getElementById('ag');g.hidden=!g.hidden">▾ Work</h3><div class="ag" id="ag">${appGrid()}</div>`,
growth:()=>`<div class="quote">${Q[new Date().getDate()%3]}<br><small class="mu">Daily quote</small></div>
<div class="video"><small>Tech Talk · learning video</small><b>${VID[S.vid]}</b><button onclick="S.vid=(S.vid+1)%3;go()">Next talk</button></div>
<div class="grid2" style="margin-bottom:12px"><a href="#obj"><b>Objective</b></a><a href="#note"><b>Notebook</b></a></div>
<h3>Track &amp; support</h3>${row('lto','⏱','LTO log-in','Log learning time')}${row('reimb','💵','Reimbursement','Claim learning costs')}${row('coach','💬','Coach & AI assistant')}
<h3>Explore</h3>${row('paths','🗺','Learning paths','Choose where you are')}${row('career','📈','Career growth','Videos, certifications, mentoring')}${row('personal','🌟','Personal growth','Skills and confidence')}${row('learn','🔄','Rotating program & Ally University')}${row('peer','👥','Register for group session','Peer connect')}
<h3>Popular resources</h3>${it('<span class="tag">5-minute video</span>Preventing Burnout Before It Starts','well')}${it('<span class="tag">Learning path</span>Emerging Leader Essentials','paths')}${it('<span class="tag">Toolkit</span>Prepare for Your Career Conversation','career')}${it('<span class="tag">Certification guide</span>Explore Professional Credentials','career')}`,
obj:()=>`<div class="card"><label>New objective</label><input id="g" placeholder="e.g. Learn dashboard design"><button class="btn" onclick="if(g.value){S.goals.push(g.value);go()}">Add objective</button></div>${S.goals.map(x=>`<div class="card">🎯 ${x}</div>`).join('')}`,
note:()=>`<div class="card"><label>Learning notes</label><textarea id="nt" rows="8" placeholder="What did you learn today?"></textarea><button class="btn">Save note</button></div>`,
lto:()=>{const mx=Math.max(...S.lto.map(e=>e.m));return`<div class="card"><label>Objective</label><input id="lo" placeholder="What will you learn?"><label>Timeframe</label><div class="chips">${[30,60,120,180].map(m=>`<button class="chip ${S.ltoMin==m?'on':''}" onclick="S.ltoMin=${m};go()">${m<60?m+' min':m/60+' hr'}</button>`).join('')}</div><label>Detail</label><input id="ld" placeholder="Course, module, book..."><button class="btn" onclick="if(lo.value){S.lto.unshift({o:lo.value,m:S.ltoMin,d:ld.value});go()}">Log learning time</button></div>
<h3>History</h3>${S.lto.map(e=>`<div class="row" style="cursor:default"><div><b>${e.o}</b><small>${e.m} min · ${e.d||'No detail'}</small></div></div>`).join('')}
<h3>Report</h3><div class="card"><p class="big">${S.lto.reduce((a,e)=>a+e.m,0)/60} hr</p><p class="mu">logged in total</p><div class="bars">${S.lto.slice().reverse().map(e=>`<i style="height:${e.m/mx*100}px"></i>`).join('')}</div></div>`},
reimb:()=>{const tot=S.rb.reduce((a,e)=>a+e.a,0);return`<div class="card"><label>Objective</label><input id="ro" placeholder="What are you claiming for?"><label>Amount ($)</label><input id="ra" type="number" inputmode="decimal" placeholder="0.00"><label>Details</label><input id="rd"><label>Attachment</label><input type="file"><button class="btn" onclick="if(ro.value&&+ra.value>0){S.rb.push({o:ro.value,a:+ra.value});go()}">Submit claim</button></div>
<div class="card"><label>How much you save</label><p class="big">$${tot.toFixed(0)}</p><div class="bars">${S.rb.map(e=>`<i style="height:${Math.max(e.a/tot*100,8)}px"></i>`).join('')}</div></div>`},
coach:()=>`<div class="card" style="display:flex;gap:14px;align-items:center"><div style="font-size:44px">🧑‍🏫</div><div><b>Your coach</b><p class="mu">Next open slot: Thursday 2 pm</p></div></div><button class="btn alt" style="margin:-4px 0 14px">Book a session</button>
<div class="card chat"><b>AI assistant</b><p class="mu" style="margin-bottom:8px">Linked to portal info so it knows your background.</p>${S.chat.map(c=>`<p class="${c[0]=='me'?'me':'ai'}">${c[1]}</p>`).join('')}<input id="q" placeholder="Ask anything"><button class="btn" onclick="if(q.value){S.chat.push(['me',q.value],['ai','Based on your goals, try a 30-minute LTO block this week. Want me to log it?']);go()}">Send</button></div>`,
learn:()=>`<div class="card"><b>🔄 Rotating application × opportunity</b><p class="mu">Try a different team for a few weeks. Browse open rotations and apply.</p><button class="btn alt">Browse rotations</button></div><div class="card"><b>🎓 Ally University</b><p class="mu">Courses picked for your objectives.</p><button class="btn alt">Open catalog</button></div>`,
peer:()=>`<div class="grid2">${box('👥','Group learning','Register for a session')}${box('☕','Coffee chat','Meet a colleague')}${box('🧭','Mentorship','Find a mentor')}${box('📒','Interest log','Share what you like')}</div>`,
life:()=>`<a class="wide" href="#well"><span style="font-size:28px">🧠</span><div><b>Mental growth &amp; wellbeing</b><small>Prevent burnout, manage stress, find support</small></div></a><h3>Lifestyle</h3><div class="grid2">${cell('focus','🍅','Focus','Tomato clock')}${cell('med','🧘','Meditation','Do not disturb')}</div>
<h3>Resources</h3><div class="grid2">${cell('family','👨‍👩‍👧','Family','Kids, healthcare, senior')}${cell('food','🍱','Food prep','Cuisines & quick tips')}${cell('hol','🎃','Holiday','Holiday shopping')}${cell('hr','🏢','HR portal','Benefits')}${cell('travel','✈️','Travel','Where next?')}${cell('others','⛅','Weather & news','Traffic and more')}</div>`,
focus:()=>`<div class="card"><p class="timer" id="tm"></p><button class="btn" id="tb" onclick="tick()"></button><button class="btn alt" onclick="S.tm=1500;clearInterval(S.run);S.run=null;go()">Reset</button></div><h3>Allowed during focus</h3><div class="card">${['Calendar','Teams messages from manager','Phone calls from family'].map(a=>`<div class="sw">${a}<input type="checkbox" checked style="width:auto;margin:0"></div>`).join('')}</div>`,
med:()=>`<div class="card" style="text-align:center"><div class="breath"></div><b>Breathe in, breathe out</b><p class="mu">5-minute guided session</p></div><div class="card sw" style="border-bottom:1px solid var(--bd)"><div><b>Do not disturb</b><small class="mu" style="display:block">Silence work alerts</small></div><input type="checkbox" ${S.dnd?'checked':''} onchange="S.dnd=this.checked" style="width:auto;margin:0"></div>`,
food:()=>`<div class="card" style="background:var(--soft)"><b>🎁 Surprise box, on site</b><p class="mu">Order a mystery lunch for pickup.</p></div><div class="chips">${['American','Spanish','Indian','Chinese'].map(c=>`<button class="chip">${c}</button>`).join('')}</div><button class="btn alt">Quick tips</button>`,
hol:()=>`<div class="grid2">${box('🎃','Halloween','Shop & plan')}${box('🌕','Moon Festival','Shop & plan')}${box('🐰','National Rabbit Festival','Shop & plan')}</div>`,
travel:()=>`<div class="grid2">${box('🏯','Asia')}${box('🏰','Europe')}${box('🌎','South America')}${box('🦁','Africa')}</div><button class="btn alt">Compare Asia vs Europe</button>`,
others:()=>`<p class="mu">Sample data</p><h3 style="margin-top:6px">Weekly weather</h3><div class="card" style="display:flex;justify-content:space-between;text-align:center">${['Mon ☀️ 91°','Tue ⛅ 88°','Wed 🌧 82°','Thu ⛅ 85°','Fri ☀️ 90°'].map(d=>`<span style="font-size:13px">${d.split(' ')[0]}<br>${d.split(' ')[1]}<br>${d.split(' ')[2]}</span>`).join('')}</div><h3>Traffic</h3>${['Dallas','Detroit'].map(c=>`<div class="row" style="cursor:default"><div><b>${c}</b><small>Moderate</small></div></div>`).join('')}<h3>News</h3><div class="card">Top stories for you will appear here.</div>`,
family:()=>`<div class="grid2">${box('🩺','Healthcare')}${box('🧒','Children')}${box('🧓','Senior')}<div class="cell" style="border-style:dashed;align-items:center;justify-content:center;color:var(--mu)">+ Add</div></div><h3>Children &amp; school</h3>${it('<b>Prepare your child for the week ahead</b><small>Routines for school, homework, meals, mornings and sleep</small>')}${it('<b>Help children handle bullying</b><small>Warning signs, supportive conversations and working with schools</small>')}${it('<b>More family support</b><small>Childcare, parenting webinars, school readiness, family planning tools</small>')}<h3>Planning</h3><p class="mu" style="margin-bottom:8px">Practical guidance for family responsibilities, finances, and major life moments.</p>${['Parenting resources','Caregiver support','Budgeting & financial wellness','Retirement planning','Life event checklists','Leave & flexibility guidance'].map(x=>it(x)).join('')}`,
paths:()=>`<p class="mu" style="margin-bottom:12px">Start where you are and build toward where you want to go.</p>${[['🌱','New Employee','Build your foundation and discover essential resources.'],['🎯','Individual Contributor','Deepen expertise, influence, and career ownership.'],['🚀','Emerging Leader','Strengthen confidence and core leadership skills.'],['⭐','People Leader','Lead healthy, engaged, and high-performing teams.']].map(p=>`<button class="path ${S.path==p[1]?'sel':''}" onclick="S.path='${p[1]}';go()"><span>${p[0]}</span><div><b>${p[1]}</b><small class="mu" style="display:block">${p[2]}</small></div></button>`).join('')}${S.path?`<p class="mu">Your path: <b>${S.path}</b></p>`:''}`,
career:()=>`<p class="mu" style="margin-bottom:12px">Build skills, explore opportunities, and take ownership of your professional growth.</p><h3 style="margin-top:0">Career development</h3>${['Individual development planning','Career mapping and role exploration','Goal-setting and skill assessments','Learning programs and certifications','Career conversation and interview guides','Training & leadership videos'].map(x=>it(x)).join('')}<h3>Mentorship</h3>${it('Find a mentor or become a mentor','peer')}${it('Mentor and mentee expectations')}${it('Discussion guides and meeting agendas')}${it('Goal-setting and progress trackers')}${it('Peer learning and coaching opportunities','peer')}<a class="btn" href="#paths" style="text-decoration:none;text-align:center">View learning paths</a>`,
mgr:()=>`<div class="card" style="background:var(--soft)"><span class="tag">Manager training</span><b style="font-size:18px">Supporting working parents</b><p class="mu">Help managers lead with empathy, flexibility and consistency while maintaining clear team expectations.</p></div>${[['Flexible work practices','Guidance for schedules and changing family needs'],['Conversation guides','Tools for thoughtful, supportive check-ins'],['Workload planning','Ways to balance priorities and prevent burnout'],['Inclusive leadership','Build a culture where caregivers can thrive']].map(x=>it(`<b>${x[0]}</b><small>${x[1]}</small>`)).join('')}`,
news:()=>`<p class="mu" style="margin-bottom:12px">A monthly collection of employee stories and practical guidance for life at and beyond work.</p><div class="card"><span class="tag">Employee spotlight</span><b>Celebrating the people who make a difference</b><p class="mu">Meet employees across the company, learn about their career journeys, interests, community impact and advice for colleagues.</p></div><a class="row" href="#med"><div><span class="tag">Work-life balance</span><b>Detaching from work without guilt</b><small>Practical ways to set boundaries, recharge and build sustainable habits.</small></div></a><h3>Also inside</h3><div class="chips">${ch('Wellness Corner','well')}${ch('Learning Corner','paths')}${ch('Family Corner','family')}${ch('Community Connections','peer')}</div><div class="feat"><span class="tag">Monthly resource spotlight</span><h3 style="margin:6px 0">Discover a resource you can use today</h3><p class="mu">Each month, one company program, benefit, learning opportunity or family support service, including what it offers and how to access it.</p></div><div class="card"><b>Spotlight archive</b><p class="mu">Browse previous features by topic, including well-being, financial wellness, learning and family support.</p></div>`,
dir:()=>`<p class="mu">Browse resources by topic, audience or life moment.</p><h3>Topic</h3><div class="chips">${[['Career','career'],['Learning','paths'],['Well-being','well'],['Family','family'],['Financial wellness','family'],['Benefits','hr'],['Personal growth','personal']].map(x=>ch(x[0],x[1])).join('')}</div><h3>Audience</h3><div class="chips">${ch('All employees','growth')}${ch('Managers','mgr')}${ch('Parents &amp; caregivers','family')}</div><h3>Life moment</h3><div class="chips">${ch('Starting a new role','paths')}${ch('Growing a family','family')}${ch('Caring for a parent','family')}${ch('Feeling burned out','well')}${ch('Planning my next step','career')}</div>`,
personal:()=>`<p class="mu" style="margin-bottom:12px">Invest in the skills, confidence, and connections that help you thrive in every season.</p>${['Confidence building','Public speaking','Strategic thinking','Creative problem solving','Community engagement','Recommended books & podcasts'].map(x=>it(x)).join('')}`,
well:()=>`<p class="mu" style="margin-bottom:12px">Strengthen resilience, protect your energy, and create healthier ways of working.</p>${it('Recognizing burnout')}${it('Healthy work boundaries','focus')}${it('Stress management','med')}${it('Mindfulness resources','med')}${it('Growth mindset learning','paths')}${it('Employee support programs','hr')}`,
hr:()=>`<div class="card"><b>HR portal</b><p class="mu">Benefits, time off and pay in one place.</p><button class="btn">View benefits</button></div>`};
function tick(){if(S.run){clearInterval(S.run);S.run=null}else S.run=setInterval(()=>{S.tm--;const e=document.getElementById('tm');e&&(e.textContent=fm());if(S.tm<=0){clearInterval(S.run);S.run=null;go()}},1000);go()}
const fm=()=>String(Math.floor(S.tm/60)).padStart(2,'0')+':'+String(S.tm%60).padStart(2,'0');
function go(){const h=(location.hash.slice(1)||'home');const k=R[h]?h:'home';document.getElementById('v').innerHTML=R[k]();document.getElementById('ttl').textContent=T[k];document.getElementById('bk').style.visibility=P[k]?'visible':'hidden';
const sec=P[k]&&P[k]!='home'?P[k]:k;document.getElementById('nav').innerHTML=[['home','🏠','Home'],['work','💼','Work'],['growth','🌱','Growth'],['life','🌿','Life']].map(n=>`<a href="#${n[0]}" class="${sec==n[0]?'on':''}"><span>${n[1]}</span>${n[2]}</a>`).join('');
const tm=document.getElementById('tm');if(tm){tm.textContent=fm();document.getElementById('tb').textContent=S.run?'Pause':'Start focus'}}
document.getElementById('bk').onclick=()=>{location.hash=P[location.hash.slice(1)]||'home'};
addEventListener('hashchange',()=>{scrollTo(0,0);go()});go();
</script></body></html>
